slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    resolution: 0.05
    max_laser_range: 6.0

    minimum_time_interval: 0.7
    minimum_travel_distance: 0.15
    minimum_travel_heading: 0.20

    transform_publish_period: 0.05
    map_update_interval: 3.0

    loop_search_maximum_distance: 2.0
    loop_match_minimum_response_fine: 0.55
    loop_match_minimum_response_coarse: 0.45
    do_loop_closing: false
    publish_tf: true