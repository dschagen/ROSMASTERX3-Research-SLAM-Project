hallway_follower:
  ros__parameters:

    # --- wall selection ---
    wall_side: "left"
    follow_any_wall: true
    wall_target_m: 0.30

    # --- forward speed ---
    cruise_speed: 0.03
    search_speed: 0.02
    linear_scale: 1.0

    # --- side-wall PD (no integral) ---
    kp_side: 0.20
    kd_side: 0.40
    angular_max: 0.20

    # --- front obstacle ---
    front_stop_m: 0.22
    front_slow_m: 0.45
    front_half_angle_deg: 35.0

    # --- corner mode ---
    corner_open_m: 0.25
    corner_turn: 0.12
    corner_turn_min: 0.06
    corner_speed: 0.025
    corner_diag_target_m: 0.50
    corner_kp: 0.30
    corner_timeout_sec: 4.0
    corner_exit_tol_m: 0.08

    # --- turn mode ---
    turn_angular: 0.08
    turn_min_time: 0.50
    turn_max_time: 2.0

    # --- settle mode ---
    settle_duration_sec: 2.0

    # --- exploration mode ---
    explore_speed: 0.08
    explore_turn_speed: 0.25
    explore_angle_tol: 0.20
    explore_goal_dist: 0.40
    explore_stuck_sec: 6.0

    # --- recovery mode ---
    recovery_backup_sec: 0.8
    recovery_turn_sec: 1.2
    recovery_backup_speed: -0.07
    recovery_turn_speed: 0.25

    # --- LiDAR geometry ---
    angle_offset_deg: 180.0
    side_inner_deg: 60.0
    side_outer_deg: 120.0
    diag_inner_deg: 30.0
    diag_outer_deg: 65.0

    # --- timing ---
    control_period_sec: 0.05
    diag_interval_sec: 3.0

    # --- startup ---
    prescan_count: 20
    wall_switch_cooldown_sec: 0.8
