hallway_follower:
  ros__parameters:

    # --- wall selection ---
    wall_side: "left"             # "left" or "right"
    wall_target_m: 0.30           # overridden by startup calibration

    # --- forward speed ---
    cruise_speed: 0.03
    search_speed: 0.02
    linear_scale: 1.0             # set to -1.0 if motors are wired backwards

    # --- side-wall PD ---
    kp_side: 0.20
    kd_side: 0.40
    angular_max: 0.20

    # --- front obstacle ---
    front_stop_m: 0.25
    front_slow_m: 0.55
    front_half_angle_deg: 40.0

    # --- corner mode ---
    corner_open_m: 0.15
    corner_turn: 0.12

    # --- turn mode ---
    turn_angular: 0.12
    turn_min_time: 0.30
    turn_max_time: 3.0

    # --- exploration mode (wall lost, explorer has a goal) ---
    explore_speed: 0.08           # forward speed toward frontier goal
    explore_turn_speed: 0.25      # turning speed toward goal heading
    explore_angle_tol: 0.20       # radians — stop turning within this (~11 degrees)
    explore_goal_dist: 0.40       # metres — consider goal reached within this

    # --- recovery mode (triggered when stuck in explore too long) ---
    explore_stuck_sec: 6.0        # seconds in explore mode before recovery triggers
    recovery_backup_sec: 0.8      # seconds to reverse
    recovery_turn_sec: 1.2        # seconds to turn after reversing
    recovery_backup_speed: -0.07  # m/s backward
    recovery_turn_speed: 0.25     # rad/s during recovery turn

    # --- LiDAR geometry ---
    angle_offset_deg: 180.0       # RPLidar A1 on X3 faces backward — do not change
    side_inner_deg: 60.0
    side_outer_deg: 120.0
    diag_inner_deg: 30.0
    diag_outer_deg: 65.0

    # --- timing ---
    control_period_sec: 0.05      # 20 Hz control loop
    diag_interval_sec: 3.0
